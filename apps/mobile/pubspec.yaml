name: moodbloom
description: "MoodBloom — a compassionate cross-platform mood tracker."
publish_to: 'none'
version: 0.2.1+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.0
  cloud_firestore: ^6.1.1
  cloud_functions: ^6.0.0
  firebase_crashlytics: ^5.0.0
  firebase_remote_config: ^6.0.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  mime: ^2.0.0
  uuid: ^4.5.1
  path: ^1.9.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.4
  synchronized: ^3.3.0
  local_auth: ^3.0.0
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  analytics_pkg:
    path: ../../packages/analytics
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.20.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
