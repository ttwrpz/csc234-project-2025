# MoodBloom CI
#
# flutter and functions jobs added in D1.5
#
# This file currently provides the WBS 2.3 firestore-rules job, which boots
# the Firestore + Storage emulators and runs the rules-unit-testing suite
# (`firebase/test/`). The base flutter (format + analyze + test + domain
# purity) and functions (TypeScript build + jest) jobs are appended by the
# D1.5 orchestration step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firestore-rules:
    name: Firestore + Storage rules emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firebase/test/package-lock.json

      - name: Set up Java 17 (required by Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules-test dependencies
        working-directory: firebase/test
        run: npm ci

      - name: Run rules tests under emulator
        run: |
          firebase emulators:exec \
            --only firestore,storage,auth \
            --project moodbloom-rules-test \
            "cd firebase/test && npm test"
