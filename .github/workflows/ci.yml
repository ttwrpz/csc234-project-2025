# MoodBloom CI
#
# Three jobs run on every push to main and every pull request:
#
#   1. flutter — format + analyze + test for apps/mobile and every package,
#      plus codegen (build_runner) and the domain-purity grep that enforces
#      "domain/ has zero Flutter/Firebase imports" from CLAUDE.md.
#   2. firestore-rules — boots the Firestore + Storage emulators and runs
#      the rules-unit-testing suite under firebase/test/ (15 cases for
#      WBS 2.3 — per-user RBAC, 24h immutability, field-level validation).
#   3. functions — TypeScript build + lint + jest for the Cloud Functions
#      proxy. Skips gracefully until functions/package.json exists (D3.1
#      lands the analyzeMoodText function per ADR-0003).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — format, analyze, test, domain purity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print tool versions
        run: |
          flutter --version
          dart --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/mobile/.dart_tool
            packages/core/.dart_tool
            packages/design_system/.dart_tool
            packages/analytics/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'packages/core/pubspec.lock', 'packages/design_system/pubspec.lock', 'packages/analytics/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # ------------------------------------------------------------------
      # Resolve dependencies for every package. design_system / analytics
      # have no tests yet but the app depends on them so they need pub get.
      # ------------------------------------------------------------------
      - name: flutter pub get (packages/core)
        working-directory: packages/core
        run: flutter pub get

      - name: flutter pub get (packages/design_system)
        working-directory: packages/design_system
        run: flutter pub get

      - name: flutter pub get (packages/analytics)
        working-directory: packages/analytics
        run: flutter pub get

      - name: flutter pub get (apps/mobile)
        working-directory: apps/mobile
        run: flutter pub get

      # ------------------------------------------------------------------
      # Codegen: Freezed / Riverpod / json_serializable. Required before
      # format/analyze because generated files are not checked in.
      # ------------------------------------------------------------------
      - name: Run build_runner (apps/mobile)
        working-directory: apps/mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ------------------------------------------------------------------
      # dart format --set-exit-if-changed in every package + the app.
      # ------------------------------------------------------------------
      - name: dart format (apps/mobile)
        working-directory: apps/mobile
        run: dart format --set-exit-if-changed .

      - name: dart format (packages/core)
        working-directory: packages/core
        run: dart format --set-exit-if-changed .

      - name: dart format (packages/design_system)
        working-directory: packages/design_system
        run: dart format --set-exit-if-changed .

      - name: dart format (packages/analytics)
        working-directory: packages/analytics
        run: dart format --set-exit-if-changed .

      # ------------------------------------------------------------------
      # flutter analyze in every package + the app.
      # ------------------------------------------------------------------
      - name: flutter analyze (apps/mobile)
        working-directory: apps/mobile
        run: flutter analyze

      - name: flutter analyze (packages/core)
        working-directory: packages/core
        run: flutter analyze

      - name: flutter analyze (packages/design_system)
        working-directory: packages/design_system
        run: flutter analyze

      - name: flutter analyze (packages/analytics)
        working-directory: packages/analytics
        run: flutter analyze

      # ------------------------------------------------------------------
      # Tests. Only apps/mobile and packages/core have tests today.
      #
      # Goldens (`@Tags(['golden'])`) are run as a separate step so font
      # rendering or pixel diffs are surfaced distinctly from logic
      # failures. Baselines are committed and only updated via local
      # `flutter test --update-goldens --tags=golden` on Linux. Off-Linux
      # contributors should not run the golden step locally — sub-pixel
      # differences make the diffs noisy.
      # ------------------------------------------------------------------
      - name: flutter test (apps/mobile)
        working-directory: apps/mobile
        run: flutter test

      - name: flutter test --tags=golden (apps/mobile)
        working-directory: apps/mobile
        run: flutter test --tags=golden

      - name: flutter test (packages/core)
        working-directory: packages/core
        run: flutter test

      - name: flutter test (packages/design_system)
        working-directory: packages/design_system
        run: flutter test

      # ------------------------------------------------------------------
      # Domain purity: the domain/ folder of every feature must NOT import
      # Flutter, Firebase, or Cloud Firestore. This is the hard rule from
      # CLAUDE.md and is graded in the Enterprise Term Assignment.
      # ------------------------------------------------------------------
      - name: Domain purity check
        run: |
          set -euo pipefail
          echo "Scanning apps/mobile/lib/features/*/domain/ for forbidden imports..."
          if grep -rEn --include="*.dart" "import 'package:(flutter|firebase_|cloud_firestore)" apps/mobile/lib/features/*/domain/ 2>/dev/null; then
            echo "::error::Domain layer must not import package:flutter, package:firebase_*, or package:cloud_firestore. See CLAUDE.md."
            exit 1
          fi
          echo "Domain purity: OK"

  firestore-rules:
    name: Firestore + Storage rules emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: firebase/test/package-lock.json

      - name: Set up Java 21 (required by firebase-tools)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules-test dependencies
        working-directory: firebase/test
        run: npm ci

      - name: Run rules tests under emulator
        run: |
          firebase emulators:exec \
            --only firestore,storage,auth \
            --project moodbloom-rules-test \
            "cd firebase/test && npm test"

  functions:
    name: Cloud Functions — lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # functions/ is a placeholder until D3.1 (analyzeMoodText). When the
      # package.json lands, this job runs the full TypeScript pipeline. It
      # exits cleanly today so PRs from S3 Day 1 / Day 2 don't go red.
      # ------------------------------------------------------------------
      - name: Detect functions package
        id: detect
        run: |
          if [ -f functions/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "functions/package.json not present yet (lands in D3.1 — analyzeMoodText). Skipping."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: functions
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: functions
        run: npm run lint --if-present

      - name: Type-check / build
        if: steps.detect.outputs.present == 'true'
        working-directory: functions
        run: npm run build --if-present

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: functions
        run: npm test --if-present
